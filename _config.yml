title: Singapore Food Manufacturers
url: https://www.sgfoodmakers.sg
favicon: /images/new sfma logo.jpg
colors:
  primary-color: "#e7131a"
  secondary-color: "#fb433d"
  media-colors:
    - title: media-color-one
      color: "#d91218"
    - title: media-color-two
      color: "#f57262"
    - title: media-color-three
      color: "#fcd6ca"
    - title: media-color-four
      color: "#414042"
    - title: media-color-five
      color: "#7f7f7f"
description: Find out more about Singapore Food Manufacturers' quality offerings!
permalink: none
baseurl: ""
collections:
  about-us:
    output: true
    order:
      - Why Singapore.md
      - Supported By.md
  events:
    output: true
    order:
      - FHA 2026.md
      - Gulfood 2026.md
      - Anuga 2025.md
      - FHA 2025.md
      - Gulfood 2025.md
  general:
    output: true
    order:
      - Overview.md
      - Product Categories/.keep
      - Product Categories/Bakery.md
      - Product Categories/Beverages.md
      - Product Categories/Condiments and Sauces.md
      - Product Categories/Cooked Food.md
      - Product Categories/Dairy.md
      - Product Categories/Edible Oils and Fats.md
      - Product Categories/Eggs and Fresh Produce.md
      - Product Categories/Food Ingredients and Flavourings.md
      - Product Categories/Meat.md
      - Product Categories/Plant Based and Alternative Proteins.md
      - Product Categories/Rice and Noodles.md
      - Product Categories/Seafood.md
      - Product Categories/Snacks and Confectionery.md
      - Product Categories/Others.md
      - Industry Partners.md
exclude:
  - travis-script.js
  - .travis.yml
  - README.md
  - package.json
  - package-lock.json
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - Gemfile
  - Gemfile.lock
include:
  - _redirects
defaults:
